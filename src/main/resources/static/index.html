<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>迷你短链服务</title>
    <link rel="icon" href="data:,">
    <style>
        :root {
            --bg: #0f172a;
            --panel: #ffffff;
            --muted: #64748b;
            --accent: #4f46e5;
            --accent-hover: #4338ca;
            --danger: #dc2626;
            --border: #e2e8f0;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC",
                         "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(160deg, var(--bg), #1e293b 60%);
            min-height: 100vh;
            color: #0f172a;
            padding: 40px 16px;
        }

        .wrap { max-width: 820px; margin: 0 auto; }

        header { color: #fff; margin-bottom: 24px; }
        header h1 { margin: 0 0 6px; font-size: 28px; letter-spacing: -0.02em; }
        header p { margin: 0; color: #94a3b8; font-size: 14px; }

        .card {
            background: var(--panel);
            border-radius: 14px;
            padding: 24px;
            box-shadow: 0 18px 40px rgba(2, 6, 23, 0.35);
            margin-bottom: 20px;
        }

        label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #334155; }

        input {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid var(--border);
            border-radius: 9px;
            font-size: 14px;
            font-family: inherit;
            outline: none;
        }

        input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15); }

        .row { display: flex; gap: 12px; flex-wrap: wrap; }
        .row > div { flex: 1 1 220px; }
        .field { margin-bottom: 14px; }

        button {
            background: var(--accent);
            color: #fff;
            border: 0;
            border-radius: 9px;
            padding: 11px 18px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover { background: var(--accent-hover); }
        button:disabled { opacity: 0.6; cursor: progress; }

        .hint { font-size: 12px; color: var(--muted); margin-top: 5px; }

        .error {
            display: none;
            margin-top: 14px;
            padding: 10px 12px;
            border-radius: 9px;
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: var(--danger);
            font-size: 13px;
        }

        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
        th { font-size: 12px; text-transform: uppercase; color: var(--muted); letter-spacing: 0.04em; }
        td.url { max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        a { color: var(--accent); text-decoration: none; }
        a:hover { text-decoration: underline; }
        .empty { color: var(--muted); font-size: 14px; padding: 8px 0; }

        .copy {
            background: #eef2ff;
            color: var(--accent);
            border: 1px solid #c7d2fe;
            padding: 4px 10px;
            font-size: 12px;
            border-radius: 7px;
        }
        .copy:hover { background: #e0e7ff; }
    </style>
</head>
<body>
<div class="wrap">
    <header>
        <h1>迷你短链服务</h1>
        <p>粘贴长链接，生成短链接。每一次访问都会被计数。</p>
    </header>

    <div class="card">
        <div class="field">
            <label for="url">长链接</label>
            <input id="url" type="text" placeholder="https://example.com/some/very/long/path?query=1" autocomplete="off">
        </div>
        <div class="row">
            <div class="field">
                <label for="code">自定义短码（可选）</label>
                <input id="code" type="text" placeholder="myalias" autocomplete="off">
                <div class="hint">3–32 个字符，仅可包含字母和数字。</div>
            </div>
            <div class="field">
                <label for="expires">过期时间（可选）</label>
                <input id="expires" type="datetime-local">
                <div class="hint">超过该时间后，访问短链将返回 410 Gone。</div>
            </div>
        </div>
        <button id="create" type="button">生成短链接</button>
        <div class="error" id="error"></div>
    </div>

    <div class="card">
        <h2 style="margin:0 0 14px;font-size:16px;">最新链接</h2>
        <table>
            <thead>
            <tr>
                <th style="width:150px;">短链</th>
                <th>原始链接</th>
                <th style="width:90px;">访问数</th>
                <th style="width:110px;">统计</th>
            </tr>
            </thead>
            <tbody id="rows"></tbody>
        </table>
        <div class="empty" id="empty">暂无链接。</div>
    </div>
</div>

<script>
    const errorBox = document.getElementById('error');
    const rows = document.getElementById('rows');
    const empty = document.getElementById('empty');
    const createBtn = document.getElementById('create');

    function showError(message) {
        errorBox.textContent = message;
        errorBox.style.display = 'block';
    }

    function esc(value) {
        return String(value ?? '').replace(/[&<>"']/g, c => (
            {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]
        ));
    }

    async function loadLinks() {
        const response = await fetch('/api/links?size=20');
        const page = await response.json();
        rows.innerHTML = '';
        empty.style.display = page.content.length ? 'none' : 'block';
        for (const link of page.content) {
            const shortUrl = location.origin + '/' + link.code;
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>
                    <a href="/${esc(link.code)}" target="_blank" rel="noreferrer">/${esc(link.code)}</a>
                    <button class="copy" data-url="${esc(shortUrl)}">复制</button>
                </td>
                <td class="url" title="${esc(link.url)}">${esc(link.url)}</td>
                <td>${link.visit_count}</td>
                <td><a href="/api/links/${esc(link.code)}/stats" target="_blank" rel="noreferrer">近 7 日</a></td>`;
            rows.appendChild(tr);
        }
        rows.querySelectorAll('.copy').forEach(btn => {
            btn.addEventListener('click', async () => {
                await navigator.clipboard.writeText(btn.dataset.url);
                btn.textContent = '已复制';
                setTimeout(() => btn.textContent = '复制', 1200);
            });
        });
    }

    createBtn.addEventListener('click', async () => {
        errorBox.style.display = 'none';
        const url = document.getElementById('url').value.trim();
        const code = document.getElementById('code').value.trim();
        const expires = document.getElementById('expires').value;

        const body = {url: url};
        if (code) body.code = code;
        if (expires) body.expires_at = new Date(expires).toISOString();

        createBtn.disabled = true;
        try {
            const response = await fetch('/api/links', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(body)
            });
            const payload = await response.json();
            if (!response.ok) {
                showError(`${payload.status} ${payload.error} — ${payload.message}`);
                return;
            }
            document.getElementById('url').value = '';
            document.getElementById('code').value = '';
            document.getElementById('expires').value = '';
            await loadLinks();
        } catch (err) {
            showError('请求失败：' + err.message);
        } finally {
            createBtn.disabled = false;
        }
    });

    document.getElementById('url').addEventListener('keydown', event => {
        if (event.key === 'Enter') createBtn.click();
    });

    loadLinks().catch(err => showError('无法加载链接列表：' + err.message));
</script>
</body>
</html>
