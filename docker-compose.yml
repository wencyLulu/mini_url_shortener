services:
  url-shortener:
    build: .
    image: url-shortener:1.0.0
    container_name: url-shortener
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: "8080"
      APP_BASE_URL: "http://localhost:8080"
    volumes:
      # H2 file database; survives container restarts.
      - shortener-data:/app/data
    restart: unless-stopped

volumes:
  shortener-data:
